<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6366f1">
  <title>Archivo - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/badges.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body class="text-slate-900 dark:text-white min-h-screen">
  <div class="blobs"><span></span><span></span><span></span></div>

  <div class="max-w-xl mx-auto p-4">

    <div class="flex items-center justify-between mb-5">
      <div>
        <h1 class="text-3xl font-extrabold"><span class="title">Archivo</span> <span class="flame">🔥</span></h1>
        <p id="who" class="text-sm text-slate-500 dark:text-slate-300"></p>
      </div>
      <div class="flex gap-2">
        <button id="lang-btn" onclick="cycleLang()" class="px-3 py-2 rounded-xl bg-white/70 dark:bg-slate-700/70 backdrop-blur text-sm font-semibold">EN</button>
        <button onclick="Theme.toggle()" class="px-3 py-2 rounded-xl bg-white/70 dark:bg-slate-700/70 backdrop-blur">🌙 ☀️</button>
        <button data-i18n="logout" onclick="logout()" class="px-3 py-2 rounded-xl bg-white/70 dark:bg-slate-700/70 backdrop-blur text-sm"></button>
      </div>
    </div>

    <div class="flex gap-2 mb-5">
      <input id="new-icon" value="🎯" maxlength="2"
        class="w-14 text-center px-2 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white/50 dark:bg-slate-800/50">
      <input id="new-title" data-i18n-ph="new_ph"
        class="flex-1 px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white/50 dark:bg-slate-800/50">
      <button onclick="addProject()" class="px-5 rounded-xl bg-indigo-600 text-white text-xl font-semibold">+</button>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow p-4 mb-5">
      <div class="flex justify-around text-center">
        <div><div class="text-3xl font-bold"><span class="flame">🔥</span> <span id="streak">0</span></div>
          <div data-i18n="streak_lbl" class="text-xs text-slate-500 dark:text-slate-400"></div></div>
        <div><div class="text-3xl font-bold">⭐ <span id="xp">0</span></div>
          <div data-i18n="xp" class="text-xs text-slate-500 dark:text-slate-400"></div></div>
        <div><div class="text-3xl font-bold">🧊 <span id="freeze-count">0</span></div>
          <div class="text-xs text-slate-500 dark:text-slate-400">Pass</div></div>
      </div>
      <button id="checkin-btn" onclick="doCheckin()"
        class="w-full mt-3 py-3 rounded-xl bg-orange-500 text-white font-semibold"></button>
      <p id="freeze-hint" class="text-xs text-center mt-2 text-slate-500 dark:text-slate-400"></p>
      <button id="freeze-btn" data-i18n="freeze_use" onclick="useFreeze()"
        class="hidden w-full mt-2 py-2 rounded-xl bg-sky-500 text-white font-semibold text-sm"></button>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow p-4 mb-5">
      <h2 data-i18n="badges_title" class="font-semibold mb-3"></h2>
      <div id="badges" class="grid grid-cols-5 gap-2"></div>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow p-4 mb-5">
      <h2 data-i18n="fr_title" class="font-semibold mb-3"></h2>
      <div class="flex gap-2">
        <input id="fr-name" data-i18n-ph="fr_ph" onkeydown="if(event.key==='Enter')addFriend()"
          class="flex-1 px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent text-sm">
        <button data-i18n="fr_add" onclick="addFriend()"
          class="px-4 rounded-lg bg-indigo-600 text-white text-sm font-semibold"></button>
      </div>
      <p id="fr-msg" class="text-xs mt-2"></p>
      <div id="fr-list"></div>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow p-4 mb-5">
      <div class="flex items-center justify-between mb-3">
        <h2 data-i18n="rem_title" class="font-semibold"></h2>
        <input type="checkbox" id="rem-on" onchange="remToggle()" class="w-6 h-6">
      </div>
      <div class="flex items-center gap-2">
        <span data-i18n="rem_time" class="text-sm"></span>
        <input type="time" id="rem-time" onchange="remSave()"
          class="flex-1 px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-transparent">
        <button data-i18n="rem_test" onclick="remTest()"
          class="px-3 py-2 rounded-lg bg-slate-200 dark:bg-slate-700 text-sm"></button>
      </div>
      <p id="rem-status" class="text-xs mt-2 text-slate-500 dark:text-slate-400"></p>
      <p data-i18n="rem_note" class="text-xs text-slate-400"></p>
    </div>

    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow p-4 mb-5">
      <h2 data-i18n="progress" class="font-semibold mb-3"></h2>

      <div class="grid grid-cols-4 gap-2 text-center mb-4">
        <div><div id="st-week" class="text-xl font-bold">0</div>
          <div data-i18n="this_week" class="text-xs text-slate-500 dark:text-slate-400"></div></div>
        <div><div id="st-month" class="text-xl font-bold">0</div>
          <div data-i18n="this_month" class="text-xs text-slate-500 dark:text-slate-400"></div></div>
        <div><div id="st-total" class="text-xl font-bold">0</div>
          <div data-i18n="total" class="text-xs text-slate-500 dark:text-slate-400"></div></div>
        <div><div id="st-best" class="text-xl font-bold">0</div>
          <div data-i18n="best" class="text-xs text-slate-500 dark:text-slate-400"></div></div>
      </div>

      <p data-i18n="last7" class="text-xs text-slate-500 dark:text-slate-400 mb-1"></p>
      <div id="weekbars" class="flex gap-2 mb-4"></div>

      <p data-i18n="last12" class="text-xs text-slate-500 dark:text-slate-400 mb-1"></p>
      <div class="overflow-x-auto">
        <div id="heatmap" class="flex gap-1 w-max"></div>
      </div>
    </div>

    <p id="err" class="text-sm text-red-500 mb-3"></p>
    <div id="list" class="space-y-4"></div>
  </div>

  <p class="footer-credit">Created with 🌌HOPE ❤️ of <b>Rounak</b></p>

  <script src="js/supabase.js"></script>
  <script src="js/streak.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/friends.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
